name: Daily BDI fetch & sync

on:
  schedule:
    - cron: '0 15 * * *'        # 北京时间每天 23:00 (UTC+8)
  workflow_dispatch: {}          # 支持在 Actions 页手动触发

permissions:
  contents: write                # 允许把更新后的 CSV/JSON 提交回仓库

concurrency:
  group: daily-bdi
  cancel-in-progress: false

jobs:
  run:
    runs-on: self-hosted         # 国内自建 runner（IMAP 登录走国内 IP）
    steps:
      - name: Checkout with retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo_url="https://github.com/${GITHUB_REPOSITORY}.git"
          branch="${GITHUB_REF_NAME:-main}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          home_dir="${RUNNER_TEMP:-/tmp}/github-home"

          mkdir -p "$home_dir"
          export HOME="$home_dir"
          mkdir -p "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git init
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local gc.auto 0
          git config --local http.version HTTP/1.1
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"

          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$repo_url"
          else
            git remote add origin "$repo_url"
          fi

          for attempt in $(seq 1 8); do
            echo "Fetch attempt ${attempt}/8 from ${repo_url}"
            if git \
              -c protocol.version=2 \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=120 \
              fetch --no-tags --prune --depth=1 origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"; then
              break
            fi

            if [ "$attempt" -eq 8 ]; then
              echo "Fetch failed after ${attempt} attempts"
              exit 1
            fi

            sleep_seconds=$((attempt * 45))
            echo "Fetch failed; retrying in ${sleep_seconds}s"
            sleep "$sleep_seconds"
          done

          git checkout --force -B "$branch" "refs/remotes/origin/${branch}"
          git reset --hard "$GITHUB_SHA" || git reset --hard "refs/remotes/origin/${branch}"
          git clean -ffdx

      - name: Set up venv & install deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run regression tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Fetch & parse BRS emails
        id: fetch
        timeout-minutes: 35
        env:
          IMAP_PWD: ${{ secrets.IMAP_PWD }}
        run: timeout --signal=TERM --kill-after=30s 30m .venv/bin/python run_bdi.py --days 7

      - name: Sync JSON to navgreen API
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}   # 可不设，未设则用代码默认地址
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: .venv/bin/python sync_bdi.py --last 7

      - name: Commit updated data
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/json baltic_exchange_index_history.csv
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore: daily BDI update $(date -u +%F) [skip ci]"
            for attempt in $(seq 1 8); do
              echo "Push attempt ${attempt}/8"
              if git \
                -c http.version=HTTP/1.1 \
                -c http.lowSpeedLimit=1000 \
                -c http.lowSpeedTime=120 \
                push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
                break
              fi

              if [ "$attempt" -eq 8 ]; then
                echo "Push failed after ${attempt} attempts"
                exit 1
              fi

              sleep_seconds=$((attempt * 45))
              echo "Push failed; retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            done
          fi

      - name: Cleanup git credentials
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE" || exit 0
          git config --local --unset-all http.https://github.com/.extraheader || true
